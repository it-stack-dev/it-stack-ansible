---
# playbooks/site-3node.yml
# IT-Stack — Three Node Deployment
#
# Tier:        1B — School / Small Office
# Computers:   3
# Node 1 RAM:  32 GB  (Foundation)
# Node 2 RAM:  24 GB  (Collaboration + Communications + VoIP)
# Node 3 RAM:  24 GB  (Business + IT Management + Monitoring)
#
# Layout:
#   lab-node1 (192.168.1.10): FreeIPA · Keycloak · PostgreSQL · Redis · Elasticsearch · Traefik
#   lab-node2 (192.168.1.11): Nextcloud · Mattermost · Jitsi · iRedMail · FreePBX · Zammad
#   lab-node3 (192.168.1.12): SuiteCRM · Odoo · OpenKM · Taiga · Snipe-IT · GLPI · Zabbix · Graylog
#
# Usage:
#   ansible-playbook -i inventory/hosts-3node.ini playbooks/site-3node.yml \
#     --vault-password-file .vault_pass -e "ansible_user=ubuntu"
#
# Deploy node by node:
#   --limit lab-node1   runs only plays whose hosts resolve to node1
#   --limit lab-node2   etc.
# ─────────────────────────────────────────────────────────────────────────────

# ══ ALL NODES: Base setup ═════════════════════════════════════════════════════

- name: "0 — Base OS hardening (all nodes)"
  hosts: all_servers
  gather_facts: true
  vars_files: [../vault/secrets.yml]
  roles:
    - role: common
      tags: [always, common]

