---
# playbooks/site-5node.yml
# IT-Stack — Five Node Deployment (Near-Production)
#
# Tier:        2 — Department / Near-Production Lab
# Computers:   5
# Node 1 RAM:  16 GB  (Identity + Proxy)
# Node 2 RAM:  32 GB  (Database)
# Node 3 RAM:  24 GB  (Collaboration + Communications apps)
# Node 4 RAM:  16 GB  (VoIP + Business systems)
# Node 5 RAM:  16 GB  (IT Management + Monitoring)
#
# Layout:
#   lab-node1 (192.168.1.10): FreeIPA · Keycloak · Traefik
#   lab-node2 (192.168.1.11): PostgreSQL · Redis · Elasticsearch
#   lab-node3 (192.168.1.12): Nextcloud · Mattermost · Jitsi · iRedMail · Zammad
#   lab-node4 (192.168.1.13): FreePBX · SuiteCRM · Odoo · OpenKM
#   lab-node5 (192.168.1.14): Taiga · Snipe-IT · GLPI · Zabbix · Graylog
#
# This is the recommended minimum for testing cross-service integrations
# realistically. The jump from 5-node to 8-node (production) is primarily
# about giving each service category its own dedicated host.
#
# Usage:
#   ansible-playbook -i inventory/hosts-5node.ini playbooks/site-5node.yml \
#     --vault-password-file .vault_pass -e "ansible_user=ubuntu"
#
# Deploy one node at a time:
#   ansible-playbook ... --limit lab-node1  # foundation first
#   ansible-playbook ... --limit lab-node2  # then database
#   ansible-playbook ... --limit lab-node3  # then apps
# ─────────────────────────────────────────────────────────────────────────────

- name: "0 — Base OS hardening (all nodes)"
  hosts: all_servers
  gather_facts: true
  vars_files: [../vault/secrets.yml]
  roles:
    - role: common
      tags: [always, common]

