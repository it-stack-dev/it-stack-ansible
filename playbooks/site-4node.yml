---
# playbooks/site-4node.yml
# IT-Stack — Four Node Deployment
#
# Tier:        2 — Department
# Computers:   4
# Node 1 RAM:  16 GB  (Identity + Proxy)
# Node 2 RAM:  32 GB  (Database — Elasticsearch needs headroom)
# Node 3 RAM:  24 GB  (Collaboration + Communications + VoIP)
# Node 4 RAM:  24 GB  (Business + IT Management + Monitoring)
#
# Layout:
#   lab-node1 (192.168.1.10): FreeIPA · Keycloak · Traefik
#   lab-node2 (192.168.1.11): PostgreSQL · Redis · Elasticsearch
#   lab-node3 (192.168.1.12): Nextcloud · Mattermost · Jitsi · iRedMail · FreePBX · Zammad
#   lab-node4 (192.168.1.13): SuiteCRM · Odoo · OpenKM · Taiga · Snipe-IT · GLPI · Zabbix · Graylog
#
# Usage:
#   ansible-playbook -i inventory/hosts-4node.ini playbooks/site-4node.yml \
#     --vault-password-file .vault_pass -e "ansible_user=ubuntu"
# ─────────────────────────────────────────────────────────────────────────────

- name: "0 — Base OS hardening (all nodes)"
  hosts: all_servers
  gather_facts: true
  vars_files: [../vault/secrets.yml]
  roles:
    - role: common
      tags: [always, common]

# ══ NODE 1: IDENTITY + PROXY ══════════════════════════════════════════════════

