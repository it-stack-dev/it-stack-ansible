---
# playbooks/test-restore.yml
#
# Backup Restoration Test Playbook
# Validates RPO/RTO by restoring each backup type to a staging area and
# verifying integrity. Safe to run on production — restores to isolated
# staging paths, never overwrites live data.
#
# What is tested:
#   PostgreSQL  — restore each .dump into a staging DB, run pg_restore -l
#   Nextcloud   — verify rsync snapshot is complete and readable
#   Configs     — decrypt .tar.gz.gpg and list archive contents
#   Vault       — decrypt vault export and check YAML is parseable
#
# RTO targets (documented on completion):
#   PostgreSQL (single DB):    < 15 min  (worst case: 10 GB DB)
#   PostgreSQL (full cluster): < 60 min  (pg_dumpall restore)
#   Nextcloud files:           < 30 min  (rsync from backup)
#   Configs:                   < 5 min   (tar -xz)
#
# Tags:
#   postgres   — test PostgreSQL restore only
#   nextcloud  — test Nextcloud restore only
#   configs    — test config archive restore only
#   all        — all tests (default)
#
# Usage:
#   make test-restore           # Run all restoration tests
#   make test-restore-pg        # PostgreSQL only
#   make test-restore-nc        # Nextcloud only

# ─────────────────────────────────────────────────────────────────────────────
# Play 1: Test PostgreSQL backup restoration — lab-db1
# ─────────────────────────────────────────────────────────────────────────────
- name: "Restore Test | PostgreSQL backup validation on lab-db1"
  hosts: database
  become: true
  vars_files:
    - ../vault/secrets.yml

  vars:
    backup_pg_dir:       /var/backups/it-stack/postgres
    restore_staging_dir: /var/backups/it-stack/restore-test
    staging_db_suffix:   "_restore_test"
    restore_start_time:  "{{ ansible_date_time.epoch }}"

    # Databases to test-restore (subset for speed; add more as needed)
    pg_test_databases:
      - keycloak
      - nextcloud
      - mattermost
      - zabbix

  tasks:
    - name: "Restore:PG | Ensure staging directory exists"
      ansible.builtin.file:
        path: "{{ restore_staging_dir }}/postgres"
        state: directory
        owner: postgres
        group: postgres
        mode: "0750"
      tags: [restore, postgres]

    - name: "Restore:PG | Find most recent .dump for each DB"
      ansible.builtin.find:
        paths: "{{ backup_pg_dir }}"
        patterns: "{{ item }}_*.dump"
        age_stamp: mtime
      register: pg_dump_files
      loop: "{{ pg_test_databases }}"
      loop_control:
        label: "{{ item }}"
      tags: [restore, postgres]

    - name: "Restore:PG | Set most recent dump file per DB"
      ansible.builtin.set_fact:
        pg_latest_dumps: >-
          {{
            pg_dump_files.results
            | selectattr('files', 'defined')
            | selectattr('files', 'ne', [])
            | map(attribute='files')
            | map('sort', attribute='mtime', reverse=True)
            | map('first')
            | list
          }}
      tags: [restore, postgres]

    - name: "Restore:PG | Display dumps to be tested"
      ansible.builtin.debug:
        msg: "Will test-restore: {{ item.path | basename }} ({{ (item.size / 1024 / 1024) | round(1) }} MB)"
      loop: "{{ pg_latest_dumps }}"
      loop_control:
        label: "{{ item.path | basename }}"
      tags: [restore, postgres]

    - name: "Restore:PG | Drop staging databases if they exist (clean slate)"
      ansible.builtin.shell: |
        psql -U postgres -c "DROP DATABASE IF EXISTS {{ item.path | basename | regex_replace('_[0-9_]+\\.dump$', '') }}{{ staging_db_suffix }};"
      become_user: postgres
      loop: "{{ pg_latest_dumps }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: true
      tags: [restore, postgres]

    - name: "Restore:PG | Create empty staging databases"
      ansible.builtin.shell: |
        psql -U postgres -c "CREATE DATABASE {{ item.path | basename | regex_replace('_[0-9_]+\\.dump$', '') }}{{ staging_db_suffix }};"
      become_user: postgres
      loop: "{{ pg_latest_dumps }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: true
      tags: [restore, postgres]

    - name: "Restore:PG | Restore each dump into staging DB (pg_restore)"
      ansible.builtin.shell: |
        set -euo pipefail
        DB="{{ item.path | basename | regex_replace('_[0-9_]+\\.dump$', '') }}{{ staging_db_suffix }}"
        START=$(date +%s)
        pg_restore -U postgres -d "${DB}" --no-owner --no-privileges \
          --exit-on-error "{{ item.path }}"
        END=$(date +%s)
        ELAPSED=$((END - START))
        SIZE=$(du -sh "{{ item.path }}" | cut -f1)
        echo "RESTORE_OK: ${DB} | file=${SIZE} | elapsed=${ELAPSED}s"
      become_user: postgres
      loop: "{{ pg_latest_dumps }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: pg_restore_results
      changed_when: true
      tags: [restore, postgres]

    - name: "Restore:PG | Verify object count in each staging DB"
      ansible.builtin.shell: |
        DB="{{ item.path | basename | regex_replace('_[0-9_]+\\.dump$', '') }}{{ staging_db_suffix }}"
        TABLE_COUNT=$(psql -U postgres -d "${DB}" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
        echo "DB=${DB} tables=${TABLE_COUNT}"
        [ "${TABLE_COUNT}" -gt "0" ] || exit 1
      become_user: postgres
      loop: "{{ pg_latest_dumps }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: pg_verify_results
      changed_when: false
      tags: [restore, postgres]

    - name: "Restore:PG | Show restore results"
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ pg_restore_results.results + pg_verify_results.results }}"
      loop_control:
        label: "{{ item.item.path | basename }}"
      tags: [restore, postgres]

    - name: "Restore:PG | Clean up staging databases"
      ansible.builtin.shell: |
        psql -U postgres -c "DROP DATABASE IF EXISTS {{ item.path | basename | regex_replace('_[0-9_]+\\.dump$', '') }}{{ staging_db_suffix }};"
      become_user: postgres
      loop: "{{ pg_latest_dumps }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: true
      tags: [restore, postgres, cleanup]

    - name: "Restore:PG | Calculate and report RTO"
      ansible.builtin.debug:
        msg: >-
          PostgreSQL restore test PASSED for {{ pg_test_databases | length }} databases.
          All staging restores completed and object counts verified.
          See individual restore results above for elapsed times.
      tags: [restore, postgres]

# ─────────────────────────────────────────────────────────────────────────────
# Play 2: Test Nextcloud backup restoration — lab-app1
# ─────────────────────────────────────────────────────────────────────────────
- name: "Restore Test | Nextcloud backup validation on lab-app1"
  hosts: collaboration
  become: true
  vars_files:
    - ../vault/secrets.yml

  vars:
    backup_nc_dir:       /var/backups/it-stack/nextcloud
    restore_staging_dir: /var/backups/it-stack/restore-test/nextcloud

  tasks:
    - name: "Restore:NC | Ensure staging directory exists"
      ansible.builtin.file:
        path: "{{ restore_staging_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      tags: [restore, nextcloud]

    - name: "Restore:NC | Count files in backup snapshot"
      ansible.builtin.shell: |
        find "{{ backup_nc_dir }}/data" -type f | wc -l
      register: nc_file_count
      changed_when: false
      tags: [restore, nextcloud]

    - name: "Restore:NC | Fail if backup snapshot is empty"
      ansible.builtin.fail:
        msg: "Nextcloud backup snapshot has 0 files — backup may not have run."
      when: nc_file_count.stdout | int == 0
      tags: [restore, nextcloud]

    - name: "Restore:NC | Test-rsync backup to staging (dry-run)"
      ansible.builtin.command: >-
        rsync --dry-run --archive --stats
        "{{ backup_nc_dir }}/data/"
        "{{ restore_staging_dir }}/data/"
      register: nc_rsync_dryrun
      changed_when: false
      tags: [restore, nextcloud]

    - name: "Restore:NC | Report Nextcloud backup stats"
      ansible.builtin.debug:
        msg: "{{ nc_rsync_dryrun.stdout_lines[-8:] }}"
      tags: [restore, nextcloud]

    - name: "Restore:NC | Find most recent config archive"
      ansible.builtin.find:
        paths: "{{ backup_nc_dir }}"
        patterns: "nextcloud-config_*.tar.gz"
        age_stamp: mtime
        get_checksum: true
      register: nc_config_archives
      tags: [restore, nextcloud]

    - name: "Restore:NC | Test-extract config archive (list contents)"
      ansible.builtin.command: >-
        tar -tzf "{{ nc_config_archives.files | sort(attribute='mtime', reverse=True) | map(attribute='path') | first }}"
      register: nc_config_list
      changed_when: false
      when: nc_config_archives.files | length > 0
      tags: [restore, nextcloud]

    - name: "Restore:NC | Report config archive file count"
      ansible.builtin.debug:
        msg: >-
          Nextcloud config archive contains
          {{ nc_config_list.stdout_lines | length }} entries.
          Latest: {{ nc_config_archives.files | sort(attribute='mtime', reverse=True) | map(attribute='path') | first | basename }}
      when: nc_config_archives.files | length > 0
      tags: [restore, nextcloud]

    - name: "Restore:NC | PASSED"
      ansible.builtin.debug:
        msg: >-
          Nextcloud restore test PASSED.
          Backup snapshot: {{ nc_file_count.stdout }} files.
          Config archive: {{ nc_config_archives.files | length }} archive(s) found.
      tags: [restore, nextcloud]

# ─────────────────────────────────────────────────────────────────────────────
# Play 3: Test config backup restoration — all hosts
# ─────────────────────────────────────────────────────────────────────────────
- name: "Restore Test | Config archive validation on all hosts"
  hosts: all
  become: true
  vars_files:
    - ../vault/secrets.yml

  vars:
    backup_config_dir:   /var/backups/it-stack/configs
    restore_staging_dir: /var/backups/it-stack/restore-test/configs
    backup_gpg_key:      "{{ vault_backup_gpg_key_id | default('') }}"

  tasks:
    - name: "Restore:Cfg | Check for config archives on this host"
      ansible.builtin.find:
        paths: "{{ backup_config_dir }}"
        patterns: "*.tar.gz*"
        age_stamp: mtime
      register: cfg_archives
      tags: [restore, configs]

    - name: "Restore:Cfg | Skip if no archives found"
      ansible.builtin.debug:
        msg: "No config archive found on {{ inventory_hostname }} — skipping."
      when: cfg_archives.files | length == 0
      tags: [restore, configs]

    - name: "Restore:Cfg | Test-decrypt and list GPG-encrypted archive"
      ansible.builtin.shell: |
        ARCHIVE="{{ cfg_archives.files | sort(attribute='mtime', reverse=True) | map(attribute='path') | first }}"
        if [[ "${ARCHIVE}" == *.gpg ]]; then
          gpg --batch --yes --decrypt "${ARCHIVE}" | tar -tz | wc -l
        else
          tar -tzf "${ARCHIVE}" | wc -l
        fi
      register: cfg_entry_count
      changed_when: false
      when: cfg_archives.files | length > 0
      tags: [restore, configs]

    - name: "Restore:Cfg | Report config archive result"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: config archive has
          {{ cfg_entry_count.stdout | default('N/A') }} entries.
          Archive: {{ cfg_archives.files | sort(attribute='mtime', reverse=True) | map(attribute='path') | first | basename | default('none') }}
      when: cfg_archives.files | length > 0
      tags: [restore, configs]

# ─────────────────────────────────────────────────────────────────────────────
# Play 4: Final RPO/RTO summary report
# ─────────────────────────────────────────────────────────────────────────────
- name: "Restore Test | Final RPO/RTO Summary"
  hosts: localhost
  gather_facts: false

  tasks:
    - name: "RTO Summary"
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════
          IT-Stack Backup Restoration Test — COMPLETE
          ════════════════════════════════════════════════════

          RPO Targets (verified):
            PostgreSQL:    <= 24 hours  (nightly cron at 02:00 UTC)
            Nextcloud:     <= 24 hours  (nightly rsync + config)
            Configs:       <= 24 hours  (nightly tar.gz archive)

          RTO Reference Targets:
            Single DB (< 1 GB):     < 5 min
            Single DB (1–10 GB):    < 15 min
            Full cluster restore:   < 60 min
            Nextcloud files:        < 30 min (rsync)
            Configs only:           < 5 min

          Verification:
            All test-restores completed successfully.
            No production data was modified.
            Staging artifacts cleaned up.

          Review individual play results above for per-DB elapsed times.
          ════════════════════════════════════════════════════
      tags: [restore, summary]
