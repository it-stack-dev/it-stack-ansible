---
# playbooks/site-1node.yml
# IT-Stack — Single Node Deployment (All 20 services on one machine)
#
# Tier:        1A — Lab / Home Lab
# Computers:   1
# Min RAM:     64 GB (recommended) / 32 GB (reduced — skip jitsi, freepbx, graylog)
# Min CPU:     16 vCPU
# Min Disk:    500 GB SSD
#
# Usage:
#   ansible-playbook -i inventory/hosts-1node.ini playbooks/site-1node.yml \
#     --vault-password-file .vault_pass -e "ansible_user=ubuntu"
#
# --tags options:
#   foundation     — FreeIPA, PostgreSQL, Redis, Keycloak, Traefik, Elasticsearch
#   collaboration  — Nextcloud, Mattermost, Jitsi
#   communications — iRedMail, FreePBX, Zammad
#   business       — SuiteCRM, Odoo, OpenKM
#   it_management  — Taiga, Snipe-IT, GLPI
#   monitoring     — Zabbix, Graylog
#
# Notes:
# - FreeIPA is installed in simplified mode (no DNS delegation, /etc/hosts used)
# - All services bind to different ports; Traefik routes by subdomain on port 443
# - Java services (Keycloak, Elasticsearch, Graylog) have reduced heap sizes
# - FreePBX SIP ports 5060/5061 still bind to the single NIC
# ─────────────────────────────────────────────────────────────────────────────

# ── 0. Common base ────────────────────────────────────────────────────────────
- name: "0 — Base OS hardening (all)"
  hosts: all_servers
  gather_facts: true
  vars_files: [../vault/secrets.yml]
  roles:
    - role: common
      tags: [always, common]

# ── 1. Identity ───────────────────────────────────────────────────────────────
- name: "1a — FreeIPA (single-node, no DNS delegation)"
  hosts: identity
  gather_facts: true
  vars_files: [../vault/secrets.yml]
  vars:
    freeipa_no_dns_delegation: true
    freeipa_forwarder: "1.1.1.1"
  roles:
    - role: freeipa
      tags: [foundation, identity, freeipa]

- name: "1b — Keycloak SSO"
  hosts: identity
  gather_facts: true
  vars_files: [../vault/secrets.yml]
  roles:
    - role: keycloak
      tags: [foundation, identity, keycloak]

