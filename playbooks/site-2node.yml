---
# playbooks/site-2node.yml
# IT-Stack — Two Node Deployment
#
# Tier:        1B — Small Lab / School
# Computers:   2
# Node 1 RAM:  32 GB  (Foundation: identity + database + proxy)
# Node 2 RAM:  32 GB  (All 14 application services)
#
# Layout:
#   lab-node1 (192.168.1.10): FreeIPA · Keycloak · PostgreSQL · Redis · Elasticsearch · Traefik
#   lab-node2 (192.168.1.11): Nextcloud · Mattermost · Jitsi · iRedMail · FreePBX · Zammad
#                              SuiteCRM · Odoo · OpenKM · Taiga · Snipe-IT · GLPI · Zabbix · Graylog
#
# Usage:
#   ansible-playbook -i inventory/hosts-2node.ini playbooks/site-2node.yml \
#     --vault-password-file .vault_pass -e "ansible_user=ubuntu"
#
# Run foundation only:
#   ansible-playbook ... --tags foundation
# Run apps only (foundation already deployed):
#   ansible-playbook ... --tags applications
# ─────────────────────────────────────────────────────────────────────────────

# ══ NODE 1: FOUNDATION ════════════════════════════════════════════════════════

- name: "0 — Base OS hardening (all nodes)"
  hosts: all_servers
  gather_facts: true
  vars_files: [../vault/secrets.yml]
  roles:
    - role: common
      tags: [always, common]

- name: "1a — FreeIPA (node1)"
  hosts: identity
  gather_facts: true
  vars_files: [../vault/secrets.yml]
  roles:
    - role: freeipa
      tags: [foundation, identity, freeipa]

- name: "1b — PostgreSQL (node1)"
