# IT-Stack Production Inventory
# Network: 10.0.50.0/24   Domain: internal.example.com
# OS: Ubuntu 24.04 Server LTS on all nodes

# ── Phase 1: Foundation ───────────────────────────────────────────────────────
[identity]
lab-id1   ansible_host=10.0.50.11

[database]
lab-db1   ansible_host=10.0.50.12

[infrastructure]
lab-proxy1 ansible_host=10.0.50.15

# ── Phase 2: Collaboration ────────────────────────────────────────────────────
[collaboration]
lab-app1  ansible_host=10.0.50.13

# ── Phase 3: Communications ───────────────────────────────────────────────────
[communications]
lab-comm1 ansible_host=10.0.50.14
lab-pbx1  ansible_host=10.0.50.16

# ── Phase 3/4: Business & IT Management ──────────────────────────────────────
[business]
lab-biz1  ansible_host=10.0.50.17

[it_management]
lab-mgmt1 ansible_host=10.0.50.18

# ── Aggregate groups ──────────────────────────────────────────────────────────
[phase1:children]
identity
database
infrastructure

[phase2:children]
collaboration

[phase3:children]
communications
business

[phase4:children]
it_management

[all_servers:children]
phase1
phase2
phase3
phase4

# ── Global SSH settings ───────────────────────────────────────────────────────
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
