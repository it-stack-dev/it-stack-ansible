# IT-Stack Lab Inventory — Tier 4: Four Nodes
#
# Use when: You have 4 computers for the lab.
# Layout:
#   Node 1 (lab-node1): Identity + Proxy — FreeIPA · Keycloak · Traefik
#   Node 2 (lab-node2): Database         — PostgreSQL · Redis · Elasticsearch
#   Node 3 (lab-node3): Collaboration + Communications — Nextcloud · Mattermost · Jitsi
#                                                         iRedMail · FreePBX · Zammad
#   Node 4 (lab-node4): Business + IT Mgmt + Monitoring — SuiteCRM · Odoo · OpenKM · Taiga
#                                                          Snipe-IT · GLPI · Zabbix · Graylog
#
# Minimum specs:
#   Node 1: 16 GB RAM, 4 vCPU, 100 GB SSD  (identity + proxy)
#   Node 2: 32 GB RAM, 8 vCPU, 200 GB SSD  (database tier — Elasticsearch needs room)
#   Node 3: 24 GB RAM, 8 vCPU, 200 GB SSD  (collaboration + communications)
#   Node 4: 24 GB RAM, 8 vCPU, 200 GB SSD  (business + IT management + monitoring)
#
# Usage:
#   ansible-playbook -i inventory/hosts-4node.ini playbooks/site-4node.yml \
#     --vault-password-file .vault_pass -e "ansible_user=ubuntu"

[identity]
lab-node1  ansible_host=192.168.1.10

[infrastructure]
lab-node1  ansible_host=192.168.1.10

[database]
lab-node2  ansible_host=192.168.1.11

[collaboration]
lab-node3  ansible_host=192.168.1.12

[communications]
lab-node3  ansible_host=192.168.1.12

[voip]
lab-node3  ansible_host=192.168.1.12

[business]
lab-node4  ansible_host=192.168.1.13

[it_management]
lab-node4  ansible_host=192.168.1.13

[monitoring]
lab-node4  ansible_host=192.168.1.13

# ── Aggregate groups ──────────────────────────────────────────────────────────
[node1:children]
identity
infrastructure

[node2:children]
database

[node3:children]
collaboration
communications
voip

[node4:children]
business
it_management
monitoring

[all_servers:children]
node1
node2
node3
node4

# ── Global settings ───────────────────────────────────────────────────────────
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
it_stack_domain=lab.local
it_stack_internal_domain=lab.local
it_stack_network=192.168.1.0/24
it_stack_gateway=192.168.1.1
it_stack_dns_server=192.168.1.10

elasticsearch_heap_size=8g
keycloak_heap_size=2g
graylog_heap_size=2g
postgresql_max_connections=500
redis_maxmemory=4gb
