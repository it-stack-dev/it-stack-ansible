# IT-Stack Lab Inventory — Tier 2: Two Nodes
#
# Use when: You have 2 computers for the lab.
# Layout:
#   Node 1 (lab-node1): Foundation — FreeIPA · Keycloak · PostgreSQL · Redis · Elasticsearch · Traefik
#   Node 2 (lab-node2): Applications — Nextcloud · Mattermost · Jitsi · iRedMail · FreePBX
#                                       Zammad · SuiteCRM · Odoo · OpenKM · Taiga · Snipe-IT
#                                       GLPI · Zabbix · Graylog
#
# Minimum specs:
#   Node 1: 32 GB RAM, 8 vCPU, 200 GB SSD  (identity + database tier)
#   Node 2: 32 GB RAM, 8 vCPU, 300 GB SSD  (all application services)
#
# Change the ansible_host values to match your actual IP addresses.
#
# Usage:
#   ansible-playbook -i inventory/hosts-2node.ini playbooks/site-2node.yml \
#     --vault-password-file .vault_pass -e "ansible_user=ubuntu"

[identity]
lab-node1  ansible_host=192.168.1.10

[database]
lab-node1  ansible_host=192.168.1.10

[infrastructure]
lab-node1  ansible_host=192.168.1.10

[collaboration]
lab-node2  ansible_host=192.168.1.11

[communications]
lab-node2  ansible_host=192.168.1.11

[voip]
lab-node2  ansible_host=192.168.1.11

[business]
lab-node2  ansible_host=192.168.1.11

[it_management]
lab-node2  ansible_host=192.168.1.11

[monitoring]
lab-node2  ansible_host=192.168.1.11

# ── Aggregate groups ──────────────────────────────────────────────────────────
[foundation:children]
identity
database
infrastructure

[applications:children]
collaboration
communications
voip
business
it_management
monitoring

[all_servers:children]
foundation
applications

# ── Global settings ───────────────────────────────────────────────────────────
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
it_stack_domain=lab.local
it_stack_internal_domain=lab.local
it_stack_network=192.168.1.0/24
it_stack_gateway=192.168.1.1
it_stack_dns_server=192.168.1.10   # FreeIPA on node1 is the DNS server

# Resource tuning for 2-node layout
elasticsearch_heap_size=2g
keycloak_heap_size=1g
graylog_heap_size=1g
postgresql_max_connections=300
redis_maxmemory=1gb
