# IT-Stack Lab Inventory — Tier 3: Three Nodes
#
# Use when: You have 3 computers for the lab.
# Layout:
#   Node 1 (lab-node1): Foundation — FreeIPA · Keycloak · PostgreSQL · Redis · Elasticsearch · Traefik
#   Node 2 (lab-node2): Collaboration + Communications — Nextcloud · Mattermost · Jitsi
#                                                         iRedMail · FreePBX · Zammad
#   Node 3 (lab-node3): Business + IT Mgmt + Monitoring — SuiteCRM · Odoo · OpenKM · Taiga
#                                                          Snipe-IT · GLPI · Zabbix · Graylog
#
# Minimum specs:
#   Node 1: 32 GB RAM, 8 vCPU, 200 GB SSD  (identity + database tier)
#   Node 2: 24 GB RAM, 8 vCPU, 200 GB SSD  (collaboration + communications)
#   Node 3: 24 GB RAM, 8 vCPU, 200 GB SSD  (business + IT management + monitoring)
#
# Usage:
#   ansible-playbook -i inventory/hosts-3node.ini playbooks/site-3node.yml \
#     --vault-password-file .vault_pass -e "ansible_user=ubuntu"

[identity]
lab-node1  ansible_host=192.168.1.10

[database]
lab-node1  ansible_host=192.168.1.10

[infrastructure]
lab-node1  ansible_host=192.168.1.10

[collaboration]
lab-node2  ansible_host=192.168.1.11

[communications]
lab-node2  ansible_host=192.168.1.11

[voip]
lab-node2  ansible_host=192.168.1.11

[business]
lab-node3  ansible_host=192.168.1.12

[it_management]
lab-node3  ansible_host=192.168.1.12

[monitoring]
lab-node3  ansible_host=192.168.1.12

# ── Aggregate groups ──────────────────────────────────────────────────────────
[foundation:children]
identity
database
infrastructure

[apps_comms:children]
collaboration
communications
voip

[apps_biz:children]
business
it_management
monitoring

[all_servers:children]
foundation
apps_comms
apps_biz

# ── Global settings ───────────────────────────────────────────────────────────
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
it_stack_domain=lab.local
it_stack_internal_domain=lab.local
it_stack_network=192.168.1.0/24
it_stack_gateway=192.168.1.1
it_stack_dns_server=192.168.1.10

elasticsearch_heap_size=4g
keycloak_heap_size=1g
graylog_heap_size=1g
postgresql_max_connections=400
redis_maxmemory=2gb
