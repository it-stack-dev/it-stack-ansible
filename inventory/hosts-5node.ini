# IT-Stack Lab Inventory — Tier 5: Five Nodes (Near-Production)
#
# Use when: You have 5 computers — recommended minimum for a realistic lab.
# Layout:
#   Node 1 (lab-node1): Identity + Proxy     — FreeIPA · Keycloak · Traefik
#   Node 2 (lab-node2): Database             — PostgreSQL · Redis · Elasticsearch
#   Node 3 (lab-node3): Collaboration        — Nextcloud · Mattermost · Jitsi · iRedMail · Zammad
#   Node 4 (lab-node4): Communications + Biz — FreePBX · SuiteCRM · Odoo · OpenKM
#   Node 5 (lab-node5): IT Mgmt + Monitoring — Taiga · Snipe-IT · GLPI · Zabbix · Graylog
#
# Minimum specs:
#   Node 1: 16 GB RAM, 4 vCPU, 100 GB SSD
#   Node 2: 32 GB RAM, 8 vCPU, 300 GB SSD  (Elasticsearch is memory hungry)
#   Node 3: 24 GB RAM, 8 vCPU, 200 GB SSD
#   Node 4: 16 GB RAM, 8 vCPU, 200 GB SSD
#   Node 5: 16 GB RAM, 8 vCPU, 150 GB SSD
#
# This maps closely to the production 8-server layout.
# The main difference from 8-node: nodes 1 & 3 combine 2 production roles each.
#
# Usage:
#   ansible-playbook -i inventory/hosts-5node.ini playbooks/site-5node.yml \
#     --vault-password-file .vault_pass -e "ansible_user=ubuntu"

[identity]
lab-node1  ansible_host=192.168.1.10

[infrastructure]
lab-node1  ansible_host=192.168.1.10

[database]
lab-node2  ansible_host=192.168.1.11

[collaboration]
lab-node3  ansible_host=192.168.1.12

[communications]
lab-node3  ansible_host=192.168.1.12

[voip]
lab-node4  ansible_host=192.168.1.13

[business]
lab-node4  ansible_host=192.168.1.13

[it_management]
lab-node5  ansible_host=192.168.1.14

[monitoring]
lab-node5  ansible_host=192.168.1.14

# ── Aggregate groups ──────────────────────────────────────────────────────────
[node1:children]
identity
infrastructure

[node2:children]
database

[node3:children]
collaboration
communications

[node4:children]
voip
business

[node5:children]
it_management
monitoring

[all_servers:children]
node1
node2
node3
node4
node5

# ── Global settings ───────────────────────────────────────────────────────────
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
it_stack_domain=lab.local
it_stack_internal_domain=lab.local
it_stack_network=192.168.1.0/24
it_stack_gateway=192.168.1.1
it_stack_dns_server=192.168.1.10

# Near-production resource sizing
elasticsearch_heap_size=8g
keycloak_heap_size=2g
graylog_heap_size=2g
postgresql_max_connections=500
redis_maxmemory=4gb
