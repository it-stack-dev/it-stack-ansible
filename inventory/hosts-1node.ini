# IT-Stack Lab Inventory — Tier 1A: Single Node (All services on one machine)
#
# Use when: You have exactly 1 computer for the lab.
# Minimum specs: Ubuntu 24.04, 64 GB RAM, 16 vCPU, 500 GB SSD
# Practical minimum: 32 GB RAM (skip FreePBX, Jitsi, Graylog to fit)
#
# All 20 services are mapped to the same host.
# FreeIPA DNS is replaced by /etc/hosts entries (no domain join needed).
# Traefik routes all services on localhost sub-paths or ports.
#
# Usage:
#   ansible-playbook -i inventory/hosts-1node.ini playbooks/site-1node.yml \
#     --vault-password-file .vault_pass -e "ansible_user=ubuntu"

[identity]
lab-solo1  ansible_host=192.168.1.10

[database]
lab-solo1  ansible_host=192.168.1.10

[collaboration]
lab-solo1  ansible_host=192.168.1.10

[communications]
lab-solo1  ansible_host=192.168.1.10

[voip]
lab-solo1  ansible_host=192.168.1.10

[business]
lab-solo1  ansible_host=192.168.1.10

[it_management]
lab-solo1  ansible_host=192.168.1.10

[infrastructure]
lab-solo1  ansible_host=192.168.1.10

# ── Aggregate groups ──────────────────────────────────────────────────────────
[all_servers:children]
identity
database
collaboration
communications
voip
business
it_management
infrastructure

# ── Global SSH & Python settings ──────────────────────────────────────────────
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
it_stack_domain=lab.local
it_stack_internal_domain=lab.local
it_stack_network=192.168.1.0/24
it_stack_gateway=192.168.1.1
# On a single node, DNS is provided by /etc/hosts instead of FreeIPA
it_stack_dns_server=127.0.0.1
# Single-node resource constraints — reduce JVM/worker sizing
elasticsearch_heap_size=1g
keycloak_heap_size=512m
graylog_heap_size=512m
postgresql_max_connections=200
redis_maxmemory=512mb
