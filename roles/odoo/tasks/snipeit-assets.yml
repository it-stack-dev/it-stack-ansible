---
# roles/odoo/tasks/snipeit-assets.yml
# INT-17: Odoo ↔ Snipe-IT — asset procurement sync
# Actions:
#   1) Assert Snipe-IT API accessible
#   2) Assert Snipe-IT API key valid (GET /api/v1/hardware?limit=1)
#   3) set_fact — derived sync variables
#   4) Deploy Python procurement sync script
#   5) Install nightly cron job (purchase orders → assets)
#   6) flush_handlers + stat assert
#
# Required variables:
#   odoo_snipeit_url             — Snipe-IT base URL (e.g. http://assets.lab.local)
#   vault_odoo_snipeit_api_key   — Snipe-IT API token (vault-encrypted)
#   odoo_snipeit_status_id       — Default Snipe-IT status label ID for new assets
#   odoo_db_name                 — Odoo database name
#   vault_odoo_admin_pass        — Odoo admin password (vault-encrypted)

- name: "INT-17 | Assert Snipe-IT API endpoint reachable"
  ansible.builtin.uri:
    url: "{{ odoo_snipeit_url | default('http://assets.lab.local') }}/api/v1/hardware?limit=1"
    method: GET
    headers:
      Authorization: "Bearer {{ vault_odoo_snipeit_api_key | default('lab-snipeit-token-placeholder') }}"
      Accept: application/json
    status_code: [200, 401, 403, 422]
    validate_certs: "{{ odoo_tls_verify | default(false) }}"
    timeout: 10
  register: _odoo_snipeit_probe
  failed_when: false
  retries: 4
  delay: 5
  tags: [odoo, integration, snipeit-assets]

- name: "INT-17 | Assert Snipe-IT API key can list categories"
  ansible.builtin.uri:
    url: "{{ odoo_snipeit_url | default('http://assets.lab.local') }}/api/v1/categories?limit=1"
    method: GET
    headers:
      Authorization: "Bearer {{ vault_odoo_snipeit_api_key | default('lab-snipeit-token-placeholder') }}"
      Accept: application/json
    status_code: [200, 401, 403]
    validate_certs: "{{ odoo_tls_verify | default(false) }}"
    timeout: 10
  register: _odoo_snipeit_categories
  failed_when: false
  tags: [odoo, integration, snipeit-assets]

- name: "INT-17 | set_fact — Odoo↔Snipe-IT procurement variables"
  ansible.builtin.set_fact:
    _odoo_snipeit_url: "{{ odoo_snipeit_url | default('http://assets.lab.local') }}"
    _odoo_snipeit_api_key: "{{ vault_odoo_snipeit_api_key | default('lab-snipeit-token-placeholder') }}"
    _odoo_snipeit_status_id: "{{ odoo_snipeit_status_id | default(1) }}"
    _odoo_snipeit_sync_script: /opt/odoo/scripts/odoo-snipeit-assets.py
  tags: [odoo, integration, snipeit-assets]

- name: "INT-17 | Ensure Odoo scripts directory exists"
  ansible.builtin.file:
    path: /opt/odoo/scripts
    state: directory
    owner: odoo
    group: odoo
    mode: "0750"
  tags: [odoo, integration, snipeit-assets]

- name: "INT-17 | Deploy Snipe-IT asset procurement sync script"
  ansible.builtin.template:
    src: odoo-snipeit-assets.py.j2
    dest: "{{ _odoo_snipeit_sync_script }}"
    owner: odoo
    group: odoo
    mode: "0750"
  tags: [odoo, integration, snipeit-assets]

- name: "INT-17 | Install nightly Odoo PO → Snipe-IT asset cron job"
  ansible.builtin.cron:
    name: "it-stack-odoo-snipeit-assets"
    user: odoo
    minute: "30"
    hour: "1"
    job: "python3 {{ _odoo_snipeit_sync_script }} >> /var/log/odoo/snipeit-assets.log 2>&1"
    state: present
  tags: [odoo, integration, snipeit-assets]

- name: "INT-17 | Flush handlers"
  ansible.builtin.meta: flush_handlers
  tags: [odoo, integration, snipeit-assets]

- name: "INT-17 | Assert asset sync script deployed"
  ansible.builtin.stat:
    path: "{{ _odoo_snipeit_sync_script }}"
  register: _odoo_snipeit_script_stat
  failed_when: not _odoo_snipeit_script_stat.stat.exists
  tags: [odoo, integration, snipeit-assets]
