---
# tasks/main.yml - odoo

- name: "Import odoo installation tasks"
  ansible.builtin.import_tasks: install.yml
  tags: [odoo, install]

- name: "Import odoo configuration tasks"
  ansible.builtin.import_tasks: configure.yml
  tags: [odoo, configure]

- name: "INT-05: Import Keycloak OIDC integration tasks"
  ansible.builtin.import_tasks: keycloak-oidc.yml
  tags: [odoo, integration, keycloak-oidc]
  when: odoo_enable_keycloak_oidc | default(true) | bool