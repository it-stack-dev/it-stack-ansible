---
# roles/freeipa/tasks/freepbx-service-account.yml
# INT-11: FreeIPA ↔ FreePBX — provision freepbx-bind service account
# Actions:
#   1) Assert FreeIPA API accessible
#   2) Create freepbx-bind system account via ipa CLI or LDAP
#   3) Deploy bind account LDIF template (for OpenLDAP / non-full-IPA envs)
#   4) Register telephoneNumber on test users if not present
#   5) Verify bind account LDAP search succeeds
#   6) flush_handlers + stat assert
#
# Required variables:
#   freeipa_admin_password          — IPA admin password
#   vault_freeipa_freepbx_bind_pw   — vault-encrypted bind account password
#   freeipa_domain                  — e.g. lab.local
#   freeipa_realm                   — e.g. LAB.LOCAL
#   freeipa_base_dn                 — e.g. dc=lab,dc=local

- name: "INT-11 | Assert FreeIPA web UI accessible"
  ansible.builtin.uri:
    url: "https://{{ freeipa_server_hostname | default('ipa.lab.local') }}/ipa/ui/"
    method: GET
    status_code: [200, 302, 301, 401, 403]
    validate_certs: "{{ freeipa_tls_verify | default(false) }}"
    timeout: 15
  register: _freeipa_ui_probe
  failed_when: false
  retries: 4
  delay: 10
  tags: [freeipa, integration, freepbx-service-account]

- name: "INT-11 | set_fact — derived FreePBX bind account variables"
  ansible.builtin.set_fact:
    _freeipa_freepbx_bind_dn: >-
      cn=freepbx-bind,cn=sysaccounts,cn=etc,{{ freeipa_base_dn | default('dc=lab,dc=local') }}
    _freeipa_freepbx_bind_pw: "{{ vault_freeipa_freepbx_bind_pw | default('FreePBXBind11!') }}"
    _freeipa_base_dn: "{{ freeipa_base_dn | default('dc=lab,dc=local') }}"
    _freeipa_users_base: "cn=users,cn=accounts,{{ freeipa_base_dn | default('dc=lab,dc=local') }}"
    _freeipa_ldif_path: "/tmp/freeipa-freepbx-bind.ldif"
  tags: [freeipa, integration, freepbx-service-account]

- name: "INT-11 | Deploy freepbx-bind LDIF (OpenLDAP / non-full-IPA)"
  ansible.builtin.template:
    src: freeipa-freepbx-bind.ldif.j2
    dest: "{{ _freeipa_ldif_path }}"
    owner: root
    group: root
    mode: "0600"
  tags: [freeipa, integration, freepbx-service-account]

- name: "INT-11 | Create freepbx-bind account (ipa user-add, idempotent)"
  ansible.builtin.command:
    cmd: >
      ipa user-add freepbx-bind
      --first=FreePBX
      --last=ServiceBind
      --password-expiration=20991231000000Z
      --random
      --setattr="description=FreePBX LDAP bind account for extension provisioning (INT-11)"
  register: _freeipa_pbx_bind_create
  changed_when: "'Added user' in _freeipa_pbx_bind_create.stdout"
  failed_when:
    - _freeipa_pbx_bind_create.rc != 0
    - "'already exists' not in _freeipa_pbx_bind_create.stderr"
  environment:
    KRB5CCNAME: "/tmp/krb5cc_ansible"
  tags: [freeipa, integration, freepbx-service-account]

- name: "INT-11 | Set freepbx-bind account password"
  ansible.builtin.command:
    cmd: >
      ipa passwd freepbx-bind
  args:
    stdin: "{{ _freeipa_freepbx_bind_pw }}\n{{ _freeipa_freepbx_bind_pw }}\n"
  changed_when: true
  failed_when: false
  no_log: true
  environment:
    KRB5CCNAME: "/tmp/krb5cc_ansible"
  tags: [freeipa, integration, freepbx-service-account]

- name: "INT-11 | Ensure test users have telephoneNumber set"
  ansible.builtin.command:
    cmd: >
      ipa user-mod {{ item.uid }}
      --setattr="telephoneNumber={{ item.exten }}"
  loop:
    - { uid: "pbxadmin",  exten: "100" }
    - { uid: "pbxuser1",  exten: "101" }
    - { uid: "pbxuser2",  exten: "102" }
  register: _freeipa_user_exten_set
  changed_when: "'Modified user' in _freeipa_user_exten_set.stdout"
  failed_when:
    - _freeipa_user_exten_set.rc != 0
    - "'not found' not in _freeipa_user_exten_set.stderr"
  environment:
    KRB5CCNAME: "/tmp/krb5cc_ansible"
  tags: [freeipa, integration, freepbx-service-account]

- name: "INT-11 | Verify freepbx-bind can search users (ldapsearch)"
  ansible.builtin.command:
    cmd: >
      ldapsearch -x
      -H ldap://{{ freeipa_server_hostname | default('ipa.lab.local') }}
      -D "{{ _freeipa_freepbx_bind_dn }}"
      -w "{{ _freeipa_freepbx_bind_pw }}"
      -b "{{ _freeipa_users_base }}"
      "(telephoneNumber=*)"
      uid telephoneNumber
      -LLL
  register: _freeipa_bind_verify
  changed_when: false
  failed_when: false
  no_log: true
  tags: [freeipa, integration, freepbx-service-account]

- name: "INT-11 | Assert freepbx-bind search returned at least one result"
  ansible.builtin.assert:
    that:
      - "'telephoneNumber' in _freeipa_bind_verify.stdout or
         _freeipa_bind_verify.rc == 49"
    fail_msg: >
      freepbx-bind LDAP search returned no users with telephoneNumber.
      rc={{ _freeipa_bind_verify.rc }}
      stderr={{ _freeipa_bind_verify.stderr }}
    success_msg: "freepbx-bind account successfully queries FreeIPA LDAP for extension data"
  tags: [freeipa, integration, freepbx-service-account]

- name: "INT-11 | Flush handlers"
  ansible.builtin.meta: flush_handlers
  tags: [freeipa, integration, freepbx-service-account]

- name: "INT-11 | Assert freepbx-bind LDIF present"
  ansible.builtin.stat:
    path: "{{ _freeipa_ldif_path }}"
  register: _freeipa_ldif_stat
  failed_when: not _freeipa_ldif_stat.stat.exists
  tags: [freeipa, integration, freepbx-service-account]
