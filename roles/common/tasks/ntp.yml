---
# roles/common/tasks/ntp.yml

- name: "Install chrony (NTP client/server)"
  ansible.builtin.apt:
    name: chrony
    state: present

- name: "Configure /etc/chrony/chrony.conf"
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart chrony

- name: "Ensure chrony is started and enabled"
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true

- name: "Force NTP sync immediately"
  ansible.builtin.command:
    cmd: chronyc makestep
  changed_when: false
