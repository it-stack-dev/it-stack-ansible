---
# roles/common/tasks/security.yml

- name: "Harden SSH — deploy sshd_config"
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: restart sshd

- name: "Configure fail2ban"
  ansible.builtin.template:
    src: fail2ban-jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: "Ensure fail2ban is started and enabled"
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

- name: "Disable root login via passwd"
  ansible.builtin.user:
    name: root
    password_lock: true

- name: "Ensure ansible user exists and is in sudo"
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: "{{ admin_groups }}"
    append: true
    shell: /bin/bash
    create_home: true

- name: "Configure sudoers for ansible user (no-password sudo)"
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: "Disable unnecessary services"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - snapd
    - multipathd
  ignore_errors: true

- name: "Configure automatic security updates (unattended-upgrades)"
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: "Enable unattended security upgrades"
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"
