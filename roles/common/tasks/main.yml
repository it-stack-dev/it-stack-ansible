---
# roles/common/tasks/main.yml
# Common base configuration applied to ALL IT-Stack servers.
# Import order matters — packages before security, security before firewall.

- name: "Import package installation tasks"
  ansible.builtin.import_tasks: packages.yml
  tags: [common, packages]

- name: "Import NTP / time sync tasks"
  ansible.builtin.import_tasks: ntp.yml
  tags: [common, ntp]

- name: "Import SSH hardening tasks"
  ansible.builtin.import_tasks: security.yml
  tags: [common, security]

- name: "Import firewall tasks"
  ansible.builtin.import_tasks: firewall.yml
  tags: [common, firewall]
