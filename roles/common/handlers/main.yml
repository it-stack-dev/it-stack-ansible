---
# roles/common/handlers/main.yml

- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: restart cron
  ansible.builtin.systemd:
    name: cron
    state: restarted

- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: reload ufw
  ansible.builtin.command:
    cmd: ufw reload
  changed_when: false

- name: reboot if kernel updated
  ansible.builtin.reboot:
    reboot_timeout: 300
    msg: "Rebooting after kernel upgrade"
  when:
    - apt_upgrade.changed
    - ansible_kernel != ansible_facts['kernel']
