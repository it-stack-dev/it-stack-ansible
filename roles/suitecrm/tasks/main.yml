---
# tasks/main.yml - suitecrm

- name: "Import suitecrm installation tasks"
  ansible.builtin.import_tasks: install.yml
  tags: [suitecrm, install]

- name: "Import suitecrm configuration tasks"
  ansible.builtin.import_tasks: configure.yml
  tags: [suitecrm, configure]

- name: "INT-04: Import Keycloak SAML integration tasks"
  ansible.builtin.import_tasks: keycloak-saml.yml
  tags: [suitecrm, integration, keycloak-saml]
  when: suitecrm_enable_keycloak_saml | default(true) | bool

- name: "INT-09: Import FreePBX CTI integration tasks"
  ansible.builtin.import_tasks: freepbx-cti.yml
  tags: [suitecrm, integration, freepbx-cti]
  when: suitecrm_enable_freepbx_cti | default(true) | bool

- name: "INT-12: Import Odoo customer sync tasks"
  ansible.builtin.import_tasks: odoo-sync.yml
  tags: [suitecrm, integration, odoo-sync]
  when: suitecrm_enable_odoo_sync | default(true) | bool