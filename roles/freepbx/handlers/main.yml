---
# roles/freepbx/handlers/main.yml

- name: "restart asterisk"
  ansible.builtin.systemd:
    name: asterisk
    state: restarted

- name: "restart apache2"
  ansible.builtin.systemd:
    name: apache2
    state: restarted

- name: "reload systemd"
  ansible.builtin.systemd:
    daemon_reload: true