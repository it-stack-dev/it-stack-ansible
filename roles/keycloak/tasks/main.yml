---
# roles/keycloak/tasks/main.yml

- name: "Import Keycloak installation tasks"
  ansible.builtin.import_tasks: install.yml
  tags: [keycloak, install]

- name: "Import Keycloak configuration tasks"
  ansible.builtin.import_tasks: configure.yml
  tags: [keycloak, configure]

- name: "Import realm and client setup tasks"
  ansible.builtin.import_tasks: realm.yml
  tags: [keycloak, realm]

- name: "Import FreeIPA LDAP federation tasks"
  ansible.builtin.import_tasks: ldap-federation.yml
  tags: [keycloak, integration, ldap-federation]
  when: keycloak_enable_ldap_federation | default(true) | bool

- name: "INT-02+: Import OIDC client provisioning tasks"
  ansible.builtin.import_tasks: oidc-clients.yml
  tags: [keycloak, integration, oidc-clients]
  when: keycloak_provision_oidc_clients | default(true) | bool
