---
# tasks/main.yml - graylog

- name: "Import graylog installation tasks"
  ansible.builtin.import_tasks: install.yml
  tags: [graylog, install]

- name: "Import graylog configuration tasks"
  ansible.builtin.import_tasks: configure.yml
  tags: [graylog, configure]

- name: "Configure Graylog log inputs and streams for all IT-Stack services"
  ansible.builtin.import_tasks: configure-inputs.yml
  tags: [graylog, inputs, streams]
  when: graylog_configure_inputs | default(true) | bool